# LXDE session definition (system-wide, read-only for the session user).
#
# This file tells lxsession which window manager to start and which GTK theme,
# icon theme and fonts the desktop uses. Debian's stock file points at
# nuoveXT2 icons and Clearlooks, but nuoveXT2 is not installed, which leaves
# every desktop shortcut with a blank placeholder icon.
#
# This is system configuration: it lives in the image, is root-owned and is
# NOT writable by the session user, so nothing here can leak between sessions.
# Per-user choices go to ~/.config instead.

[Session]
window_manager=openbox-lxde
# polkit has no authority to act on inside a container; running the agent only
# produces a "No session for pid N" error dialog on the desktop.
polkit/command=/bin/true
# No screensaver and no screen lock: an idle blank/locked screen in a browser
# VNC session is just a support ticket - and the session user has no password,
# so a locked session could not be unlocked from the browser again. lxlock is
# not installed either, so lxsession simply does not offer the action.

[GTK]
# GTK3 on Debian trixie: the whole LXDE stack (lxsession, lxpanel, pcmanfm,
# lxterminal) is GTK3, so the GTK2 theme names below only matter to lxsession.
# "Clearlooks" is NOT a GTK theme here - the package ships it as an openbox
# window-decoration theme - so the widget theme is left at GTK3's own Adwaita.
sNet/ThemeName=Adwaita
# Icon theme. GTK3 builds its lookup chain as
#   <current theme> -> Adwaita -> gnome -> hicolor
# (see gtk_icon_theme_load_themes() in gtkicontheme.c), so Adwaita is ALWAYS
# reachable and supplies the symbolic icons every GTK3 widget asks for
# (view-refresh-symbolic, dialog-information-symbolic, ...). Tango stays the
# current theme because it is the only source of the full-colour legacy names
# the LXDE UI itself uses: terminal, system-file-manager, web-browser,
# gnome-log-out. Adwaita 48 is a symbolic theme and has none of those.
# Both themes need librsvg2-common: without the SVG loader every scalable
# icon (Tango's included) renders blank.
sNet/IconThemeName=Tango
sGtk/FontName=Sans 10
iGtk/ToolbarStyle=3
iGtk/ButtonImages=1
iGtk/MenuImages=1
iGtk/CursorThemeSize=18
iXft/Antialias=1
iXft/Hinting=1
iXft/RGBA=none
iXft/HintStyle=hintslight
