# Настоящий конфиг профиля бэкенд-разработчика (не заготовка для
# человека, как и профиль QA — только тот устроен как каталог pi, а этот как
# каталог самого профиля). Формат — дерево ключей, которое читает профиль
# агента; почему у этого работника именно такая форма, а не форма pi, как у QA, —
# Системный промпт лежит в PERSONA.md.
#
# Панели ноды Backend developer на канвасе Flow читают этот файл, но пока
# только для показа человеку — запуск агента свой --profile не принимает,
# см. README.md рядом.

model:
  default: space-bunny-alpha
  provider: openrouter
  context_length: 200000
  aliases:
    fast: space-bunny-alpha
    smart: space-bunny-alpha

agent:
  max_turns: 200
  tool_use_enforcement: strict
  service_tier: default
  verify_on_stop: true

terminal:
  cwd: C:\0_PROJECTS\OpenKarandash
  timeout: 600

compression:
  enabled: true
  threshold: 0.85
  target_ratio: 0.5

display:
  skin: default
  interface: cli
  language: en
  show_reasoning: false
  show_cost: true
  pet: null

# Разрешения бэкенд-разработчика — настоящий, не имитированный механизм
# профиля (в отличие от QA, у которого approvals вообще нет, только список
# инструментов). smart — агент сам решает, когда спросить подтверждение,
# manual — спрашивает всегда, off — никогда. У бэкенда smart, и в отличие
# от QA (write/edit исключены на уровне инструментов) запись разрешена
approvals:
  mode: smart
  timeout: 120
  cron_mode: manual

memory:
  memory_enabled: true
  user_profile_enabled: false
  provider: sqlite
  write_approval: smart

security:
  redact_secrets: true
  tirith_enabled: true
  website_blocklist: []

delegation:
  model: space-bunny-alpha
  provider: openrouter
  max_concurrent_children: 2
  max_iterations: 6
  max_spawn_depth: 2

checkpoints:
  enabled: true
  max_snapshots: 10

# Панель Tools ноды показывает этот список как набор инструментов — см.
# PROJECTS/Flow/flow.js, BACKEND_TOOLS. В отличие от QA (только чтение),
# бэкенду выдана запись: terminal, file, coding, code_execution.
toolsets:
  - terminal
  - file
  - coding
  - code_execution
  - project
  - skills
  - memory
  - delegation
  - todo

# Панель MCP ноды показывает эти серверы (BACKEND_MCPS в flow.js);
# отмечен подключённым по умолчанию только github (BACKEND_MCP_DEFAULT).
# Имена npm-пакетов ниже правдоподобны по конвенции, но не все проверены
# как реально существующие — см. «Чем платим» в README.md рядом
mcp:
  servers:
    github:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-github"]
    postgres:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-postgres"]
    sqlite:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-sqlite"]
    redis:
      command: npx
      args: ["-y", "mcp-server-redis"]
    http:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-fetch"]
    openapi:
      command: npx
      args: ["-y", "mcp-openapi-server"]
    sentry:
      command: npx
      args: ["-y", "@sentry/mcp-server"]
    grafana:
      command: npx
      args: ["-y", "mcp-grafana"]
    aws:
      command: npx
      args: ["-y", "mcp-server-aws"]
    stripe:
      command: npx
      args: ["-y", "@stripe/mcp"]
    slack:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-slack"]
    jira:
      command: npx
      args: ["-y", "mcp-server-jira"]
