# pcmanfm desktop (profile LXDE) settings.
#
# Copied into the session home on first run, then owned by the session user and
# freely editable - every session gets its own copy.
#
# pcmanfm 1.4 writes this file itself using the group name "[*]", so the
# defaults below use the same format, otherwise pcmanfm overwrites them on the
# first start. Debian's default points at /etc/alternatives/desktop-background,
# which does not exist in this image, so the desktop came up solid black.
[*]
wallpaper_mode=crop
wallpaper_common=1
wallpaper=/home/desktop/wallpaper.png
desktop_bg=#1c2a48
desktop_fg=#ffffff
desktop_shadow=#000000
desktop_font=Sans 12
show_wm_menu=0
show_documents=0
show_trash=1
show_mounts=0
sort=name;ascending;
