services:
  app:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - ./DATA:/app/DATA
    environment:
      - NO_RELOAD=0
      - HOST_DEPS=0
      - HERMES_STACK=0
      - HOST=0.0.0.0
      - ALLOW_CONTAINER=1
    restart: unless-stopped

volumes:
  project:
  data:
