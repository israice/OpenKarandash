<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Bridge Console</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --ink: #16181d; --muted: #6b7280;
    --line: #e3e6ea; --accent: #2f6df6; --tool: #7a4dd6; --warn: #b45309;
    --user-bg: #eef3ff; --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel: #1c1f25; --ink: #e7eaee; --muted: #9aa2ad;
      --line: #2b2f37; --user-bg: #232a3a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
  .dot.ok { background: #16a34a; } .dot.bad { background: #dc2626; }
  header .spacer { flex: 1; }
  select, button, input[type=text] {
    font: inherit; color: inherit; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .55; cursor: default; }
  main { max-width: 900px; margin: 0 auto; padding: 16px 16px 200px; }
  .msg { border: 1px solid var(--line); background: var(--panel);
         border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
  .msg.user { background: var(--user-bg); }
  .role { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
          color: var(--muted); margin-bottom: 6px; font-weight: 650; }
  .body { white-space: pre-wrap; word-wrap: break-word; }
  .msg img { max-width: 220px; border-radius: 8px; margin-top: 8px; display: block; border: 1px solid var(--line); }
  .toolcall { border-left: 3px solid var(--tool); background: color-mix(in srgb, var(--tool) 8%, transparent);
              padding: 8px 10px; border-radius: 6px; margin-top: 8px; font-family: ui-monospace, monospace; font-size: 12.5px; }
  .toolcall .name { color: var(--tool); font-weight: 700; }
  .meta { margin-top: 8px; font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .err { border-color: #dc2626; }
  .err .role { color: #dc2626; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
           border-top: 1px solid var(--line); padding: 10px 16px; }
  .composer { max-width: 900px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: vertical; min-height: 46px; max-height: 200px; font: inherit;
             color: inherit; background: var(--bg); border: 1px solid var(--line);
             border-radius: 10px; padding: 10px 12px; }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 auto 8px; max-width: 900px; }
  .thumbs img { height: 44px; border-radius: 6px; border: 1px solid var(--line); }
  .hint { max-width: 900px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }
  label.toolbox { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Claude Bridge</h1>
  <select id="model"></select>
  <select id="mode" title="Кто отвечает">
    <option value="agent">Агент Hermes (инструменты, скиллы)</option>
    <option value="model">Чистая модель Claude</option>
  </select>
  <label class="toolbox" id="toolslabel"><input type="checkbox" id="usetools"> demo-инструмент</label>
  <span class="spacer"></span>
  <span id="target" class="hint" style="margin:0"></span>
  <button id="clear">Очистить</button>
</header>

<main id="log"></main>

<footer>
  <div class="thumbs" id="thumbs"></div>
  <div class="composer">
    <textarea id="input" placeholder="Сообщение… (Enter — отправить, Shift+Enter — перенос строки)"></textarea>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <button id="attach" title="Прикрепить изображение">🖼</button>
    <button id="send" class="primary">Отправить</button>
  </div>
  <div class="hint" id="hint">Стриминг, вызовы инструментов, изображения и расход токенов отображаются ниже.</div>
  <div class="hint" id="modehint"></div>
</footer>

<script src="/app.js"></script>
</body>
</html>
