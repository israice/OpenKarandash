# Стартовый config.yaml для hermes-home/ (сама папка в git не попадает —
# рантайм-данные конкретного запуска). hermes-start.sh копирует этот файл
# туда сам при первом запуске, если его ещё нет.
#
# Без этого файла свежий Hermes поднимается с provider: auto и не найдёт
# никаких credentials — писать некому. Этот файл явно указывает единственный
# путь к модели в этом проекте: через claude-bridge, без Anthropic API-ключа
# и без OAuth. DOCS/decisions/029.
model:
  default: claude-bridge-sonnet
  provider: claude-bridge
fallback_providers: []

providers:
  claude-bridge:
    # Бридж живёт на ХОСТЕ рядом с claude CLI, поэтому адрес разный у разных
    # вызывающих: контейнер видит его как host.docker.internal (Docker Desktop
    # поднимает контейнеры в своей VM — network_mode: host — это сеть VM,
    # а не хоста WSL), процесс на хосте — как 127.0.0.1.
    # docker-compose.hermes.yml прокидывает CLAUDE_BRIDGE_URL в контейнер —
    # порт бриджа задаётся там же (по умолчанию 8788, см. .env.example).
    # Только ${ИМЯ}: shell-синтаксис ${ИМЯ:-значение} Hermes не разворачивает
    # и оставляет строку как есть — тогда провайдер молча становится «custom»
    # с несуществующим адресом и отвечает «Connection error»
    base_url: "${CLAUDE_BRIDGE_URL}"
    api_mode: chat_completions
    model: claude-bridge-sonnet
    # Значим только когда порт бриджа выходит за loopback; пустой токен бридж
    # трактует как «авторизация выключена»
    key_env: "CLAUDE_BRIDGE_TOKEN"

toolsets:
  - hermes-cli

# ── Настройка под claude-bridge и контейнер (OpenKarandash-jkg) ─────────
# Разбор сессий 2026-09-17: служебные вызовы шли в Sonnet (фоновая проверка
# одна съела 5,6 млн входных токенов за два дня), execute_code всегда
# блокировался, модель получала ненужные ей браузерные инструменты и
# выгружала в контекст файлы по 40 тыс. символов. DOCS/decisions/039.

# Набор инструментов для запросов через API (так ходит OpenKarandash).
# Без browser_* (браузера в контейнере нет), без tts/image_gen/homeassistant.
platform_toolsets:
  api_server:
    - web
    - terminal
    - file
    - skills
    - todo
    - memory
    - session_search
    - code_execution
    - delegation
    - vision
    - cronjob

# Мелкие служебные задачи — на Haiku через тот же мост: вердикт по команде
# и заголовок сессии не требуют Sonnet, а ждать их приходилось как полный ход.
auxiliary:
  approval:
    provider: claude-bridge
    model: claude-bridge-haiku
  title_generation:
    provider: claude-bridge
    model: claude-bridge-haiku
  # Самообучение после хода (память, навыки) оставлено, но на Haiku: чужая
  # модель получает сжатый пересказ переписки, а не всю её заново, и потолок
  # суммарного ввода втрое ниже штатных 600 тыс.
  background_review:
    enabled: true
    provider: claude-bridge
    model: claude-bridge-haiku
    max_input_tokens: 200000

approvals:
  # API-сессии Hermes считает «безлюдными» и при deny молча блокирует
  # execute_code целиком — модель тратила ходы на заведомо отклонённый вызов.
  # Контейнер и есть песочница; опасные команды терминала по-прежнему
  # проверяет смарт-проверка (теперь на Haiku), жёсткий запрет остаётся.
  unattended_mode: approve
  # Проверяющему модели Hermes принимает ответ только ровно из одного слова, а
  # мост не может ограничить длину ответа (max_tokens CLI не понимает): Haiku
  # дописывал пояснение, и безобидный `python3 -c` уходил «на решение человеку»,
  # которого в API-сессии нет, — модель тратила ходы на обход. Здесь же — что
  # считать опасным в этом проекте, чтобы эскалаций не было вовсе.
  smart_policy: >-
    Reply with the verdict word ONLY — no explanation, no punctuation, nothing
    after it. There is never a human available: ESCALATE blocks the agent
    outright, so choose APPROVE or DENY. Commands run in a disposable Docker
    container; the only host paths it can write are the project folder and the
    agent's home. APPROVE interpreter one-liners (python -c, node -e),
    inspection, builds, tests, git reads and ordinary edits, even when a scanner
    flagged quoting or nesting. DENY deleting or overwriting the project, its
    .git or DATA/ folders, rewriting or force-pushing git history, and sending
    secrets or files to outside hosts.

# read_file без limit отдавал до 100 тыс. символов за раз: дампы уходили в
# контекст целиком и ускоряли сжатие, после которого их читали снова.
file_read_max_chars: 40000

agent:
  # Попадает в системный промпт (блок подсказок об окружении). Только то, чего
  # модель не узнает сама и на чём раньше спотыкалась в этом контейнере.
  environment_hint: >-
    OpenKarandash container: the project is a Windows folder mounted at
    /mnt/c/0_PROJECTS/OpenKarandash; this is Linux (no powershell.exe).
    SQLite databases on that mount (DATA/.sessions.db, DATA/.index.db,
    hermes-home/state.db) are in WAL mode and fail to open with "disk I/O error" —
    do not copy or dump them. Search code, notes and past sessions with
    `node PROJECTS/Graph/search.js [--kind code|note|session] "query"`
    (it falls back to the running server). Session data comes from the
    OpenKarandash server API at http://host.docker.internal:3001 (POST, JSON):
    /api/sessions (list) and /api/sessions/messages {"id": "<session id>"}.
    git works normally. Read big files in ranges (offset/limit) and keep search
    context small instead of writing large outputs to files and reading them back whole.
