<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Hello World</title>
    <!-- иконки у пульта нет: пустая заглушка, иначе браузер просит /favicon.ico и пишет 404 в консоль при каждой загрузке -->
    <link rel="icon" href="data:,">
    <!-- Стили разложены по компонентам и подключаются файлами: внутри страницы их
         больше нет. Иначе правка стиля тянет за собой перезагрузку всей страницы,
         а у компонента появляется второе место жительства. Порядок файлов повторяет
         прежний порядок правил, каскад от переноса не изменился. -->
    <link rel="stylesheet" href="SYSTEM/styles/base.css">
    <link rel="stylesheet" href="SYSTEM/styles/views.css">
    <link rel="stylesheet" href="SYSTEM/styles/modal.css">
    <!-- Словарь сообщений ленты общий на три отображения (Sessions, Feed,
         Flow), поэтому лежит здесь, а не в папке вкладки. -->
    <link rel="stylesheet" href="SYSTEM/styles/messages.css">
    <!-- Переключатель режима отправки общий с попапом Karandash. -->
    <link rel="stylesheet" href="SYSTEM/styles/mode-switch.css">
    <!-- Кнопка Karandash живёт целиком в PROJECTS/Karandash: и стили, и скрипт. -->
    <link rel="stylesheet" href="PROJECTS/Karandash/karandash.css">
    <!-- Вкладка Sessions живёт целиком в PROJECTS/Sessions: серверная половина
         рендерит session-view.eta в страницу на месте одноимённой заглушки
         (renderPage, как верхнее меню — DOCS/decisions/005), стили лежат рядом. -->
    <link rel="stylesheet" href="PROJECTS/Sessions/sessions.css">
    <!-- Редактор файла живёт целиком в PROJECTS/Graph: стили, скрипт и серверная половина. -->
    <link rel="stylesheet" href="PROJECTS/Graph/file-editor.css">
    <link rel="stylesheet" href="PROJECTS/Graph/vendor/easymde/easymde.min.css">
    <!-- Вкладка Flow живёт целиком в PROJECTS/Flow: и стили, и скрипт. -->
    <link rel="stylesheet" href="PROJECTS/Flow/flow.css">
    <!-- Карта импортов для three.js: 3D-персонаж в ноде QA (PROJECTS/Flow/flow-minion.js)
         берёт библиотеку из node_modules голым специфером `three` — так же её
         импортируют адресные модули самой библиотеки (GLTFLoader). Стоит раньше
         любого <script type="module">, иначе браузер её не применит (DOCS/decisions/027). -->
    <script type="importmap">
    {
        "imports": {
            "three": "/node_modules/three/build/three.module.js",
            "three/addons/": "/node_modules/three/examples/jsm/",
            "@dimforge/rapier3d-simd-compat": "/node_modules/@dimforge/rapier3d-simd-compat/rapier.mjs"
        }
    }
    </script>
    <!-- Вкладка Kanban живёт целиком в PROJECTS/Kanban: и стили, и скрипт. -->
    <link rel="stylesheet" href="PROJECTS/Kanban/kanban.css">

    <!-- Каскад выбора модели: строка из четырёх уровней стоит и в настройках,
         и в шапке сессии — поэтому стили у неё общие, а не в одной из папок.
         Стоят на месте прежних правил каскада из settings.css, чтобы порядок
         <link> не изменился. -->
    <link rel="stylesheet" href="SYSTEM/styles/model-cascade.css">

    <!-- Настройки живут целиком в PROJECTS/Settings: и стили, и скрипт. -->
    <link rel="stylesheet" href="PROJECTS/Settings/settings.css">
    <!-- Вкладка Book живёт целиком в PROJECTS/Book: и стили, и скрипт. -->
    <link rel="stylesheet" href="PROJECTS/Book/book.css">
    <!-- Вкладка Telegram живёт целиком в PROJECTS/Telegram: и стили, и скрипт. -->
    <link rel="stylesheet" href="PROJECTS/Telegram/telegram.css">
    <link rel="stylesheet" href="SYSTEM/toolbar-menu.css">
    <!-- пометка суждения о ходе: один стиль на Sessions, Feed и Flow -->
    <link rel="stylesheet" href="SYSTEM/judgment-badge.css">
    <!-- тег модели над ответом: тоже один стиль на все три отображения -->
    <link rel="stylesheet" href="SYSTEM/model-tag.css">

    <!-- Вкладку выбираем до первой отрисовки, а не отложенными скриптами ниже.
         Первая отрисовка всегда раньше любого скрипта: разметка разобрана, скрипты
         с defer и модули ещё не выполнялись (в замере это 84 мс первой отрисовки
         против 187 мс DOMContentLoaded, где отработал весь их цепочка). Разметка
         ни одна вкладка в разметке не открыта, и при перезагрузке место выбора
         остаётся пустым до того, как выбор вкладки случается. Этот короткий
         скрипт ставит метку на
         <html> ещё до разбора тела, SYSTEM/styles/views.css по ней не рисует ни
         одной вкладки, а снимает метку тот, кто вкладку показал (SYSTEM/tabs.js)
         или страница кнопки «+» (SYSTEM/new-button.js).
         Ключ lastView и запасная вкладка — те же, что в SYSTEM/tabs.js
         (LAST_VIEW_KEY и DEFAULT_VIEW): файл лежит в <head> и импортировать его
         отсюда нельзя, поэтому общие сведения приходится повторять. -->
    <script>
        (function () {
            var view;
            // localStorage может быть недоступен (приватный режим) — тогда открываем
            // то же, что и tabs.js при отсутствии сохранённого места
            try { view = localStorage.getItem('lastView') || 'chat'; } catch (e) { view = 'chat'; }
            document.documentElement.setAttribute('data-restored-view', view);
            // Заслон на время первой сборки страницы: пока разделы не дорисовали
            // своё содержимое, страница не показывается вовсе (SYSTEM/boot.js,
            // стиль в SYSTEM/styles/base.css). Метку ставим здесь же, в <head>:
            // поставленный позже скрипт успел бы показать пустую страницу.
            document.documentElement.setAttribute('data-booting', '');
            // страховка на случай, если отложенные скрипты не дошли: без метки
            // вкладка осталась бы пустой навсегда. К load они уже отработали
            // (defer и модули выполняются до load), так что штатно это пустое место
            window.addEventListener('load', function () {
                document.documentElement.removeAttribute('data-restored-view');
            });
        })();
    </script>
</head>
<body>
    <!-- Верхнее меню рисует сервер (DOCS/decisions/005): вся его разметка лежит
         в шаблоне SYSTEM/topbar.eta и подставляется в страницу на месте заглушки
         TOPBAR ниже (renderPage в SYSTEM/core/version.js). Литерал заглушки здесь
         не пишется: replace() берёт первое вхождение, и меню уехало бы в этот
         комментарий. Тем же шаблоном отдаётся маршрут
         /api/fragment/topbar. Меню приходит вместе со страницей одной частью —
         раньше его половину дописывали скрипты уже после разбора страницы
         (шестерёнка настроек, кнопка Karandash), и верхний ряд дёргался на глазах.
         Здесь остаётся только сама полка: её высота заложена в тело каждой
         вкладки через --topbar-height, поэтому она должна быть в разметке страницы. -->
    <!-- hx-get + hx-swap="innerHTML" + hx-trigger="fragment-reload": правка
         topbar.eta доезжает точечной подменой innerHTML (событие fragment:topbar,
         htmx.ajax в SYSTEM/core/watch.js). hx-trigger намеренно не «load»:
         тогда htmx перефетчит фрагмент при загрузке страницы и подменит
         SSR-разметку свежей копией; «fragment-reload» — событие, которое
         никто не шлёт, оно только перебивает дефолтный click-триггер htmx
         на div. -->
    <div class="topbar" id="topbar" hx-get="/api/fragment/topbar" hx-swap="innerHTML" hx-trigger="fragment-reload">{{TOPBAR}}</div>

    <div class="view view--side" id="flowView" hidden>
        <!-- Разметка полотна живёт в PROJECTS/Flow/flow.eta и подставляется сервером:
             контейнер принимает ответ своим innerHTML; правка .eta доезжает
             точечной подменой одного фрагмента (DOCS/decisions/011). -->
        <div id="flowBody" hx-get="/api/fragment/flow" hx-trigger="load" hx-swap="innerHTML"></div>
    </div>

    <!-- Kanban — чистая UI-заготовка: разметку колонок строит сам kanban.js,
         тут только пустой контейнер вкладки (DOCS/decisions/032) -->
    <div class="view view--board" id="kanbanView" hidden></div>

    <!-- Вкладка Telegram живёт в PROJECTS/Telegram (шаблон — telegram-view.eta
         в PROJECTS/Settings, сервер — telegram-server.js): разметка приходит
         готовой из серверной сборки страницы, telegram.js только вешает
         обработчики и индикатор связи. Стоит перед Sessions, как и раньше. -->
    <div class="view view--telegram" id="telegramView" hidden hx-get="/api/fragment/telegram-view" hx-swap="innerHTML" hx-trigger="fragment-reload">{{TELEGRAM_VIEW}}</div>

    <!-- Вкладка Sessions целиком живёт в PROJECTS/Sessions: разметка —
         session-view.eta сервером подставляется на место заглушки,
         стили лежат рядом. -->
    <div class="view view--sessions" id="chatView" hidden hx-get="/api/fragment/session-view" hx-swap="innerHTML" hx-trigger="fragment-reload">{{SESSION_VIEW}}</div>

    <!-- Вкладка Book: разметка — book-view.eta; сервер подставляет её на
         место заглушки BOOK_VIEW и раздаёт моментный маршрут; book-tab.js
         только карточки и README. -->
    <div class="view view--side view--book" id="bookView" hidden hx-get="/api/fragment/book-view" hx-swap="innerHTML" hx-trigger="fragment-reload">{{BOOK_VIEW}}</div>

    <div class="shot-lightbox" id="shotLightbox" hidden>
        <img id="shotLightboxImg" src="" alt="">
    </div>

    <div class="worker-tooltip" id="workerTooltip"></div>

    <!-- Модалка настроек и окно выбора CLI: шаблон PROJECTS/Settings/settings-modal.eta,
         подставляется сервером на место заглушки SETTINGS_MODAL; логика —
         settings.js и входящие модули Settings. -->
    <div id="settingsSlot" hx-get="/api/fragment/settings-modal" hx-swap="innerHTML" hx-trigger="fragment-reload">{{SETTINGS_MODAL}}</div>

    <div class="modal file-modal" id="fileModal" hidden>
        <div class="modal__backdrop" data-close-modal></div>
        <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="fileModalTitle">
            <div class="modal__header">
                <h2 class="modal__title" id="fileModalTitle"></h2>
            </div>
            <p class="file-modal__meta" id="fileModalMeta"></p>
            <div class="file-modal__links" id="fileModalLinks"></div>
            <textarea class="file-modal__text" id="fileModalText" spellcheck="false" aria-label="File contents"></textarea>
            <div class="file-modal__footer">
                <span class="file-modal__status" id="fileModalStatus"></span>
                <button type="button" class="file-modal__save" id="fileModalSave">Save</button>
            </div>
        </div>
    </div>

    <!-- Окно настроек (#settingsModal) — в PROJECTS/Settings/settings.js -->

    <div class="modal" id="versionModal" hidden>
        <div class="modal__backdrop" data-close-modal></div>
        <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="versionModalTitle">
            <div class="modal__header">
                <h2 class="modal__title" id="versionModalTitle">Version history</h2>
            </div>
            <ul class="version-list">{{VERSION_LIST}}</ul>
        </div>
    </div>

    <button type="button" class="app-version" id="appVersionButton">{{APP_VERSION}}</button>

    <!-- Всё с defer: код стартует после разбора разметки, порядок элементов на странице
         ни на что не влияет, а падение одного файла не отменяет остальные.
         app.js идёт первым — он кладёт в window.App общее ядро, которое берут вкладки и кнопки. -->
    <!-- Пути пишутся от корня проекта: страница отдаётся по адресу «/», и браузер
         считает относительные ссылки от него, а не от папки SYSTEM. -->
    <!-- Settings грузится первым: app.js на своём верхнем уровне сразу ищет
         #settingsModal/#pickerModal в DOM — теперь приходят с сервером (settings-modal.eta). -->
    <!-- htmx: серверные фрагменты подменяют куски страницы без своего JS.
         Файл ставится через npm (package.json), поэтому путь ведёт в node_modules -->
    <script src="node_modules/htmx.org/dist/htmx.min.js" defer></script>
    <!-- Части Settings грузятся перед settings.js и в том же порядке: остальные
         только заводят window.Settings* с init(...) — сами ничего не выполняют. -->
    <!-- Заслон первой сборки: самый первый отложенный скрипт, чтобы разделы,
         идущие ниже, могли звать window.MissionBoot.task (SYSTEM/boot.js). -->
    <script src="SYSTEM/boot.js" type="module"></script>
    <script src="PROJECTS/Settings/settings-providers.js" defer></script>
    <script src="PROJECTS/Settings/settings-screenshot.js" defer></script>
    <script src="PROJECTS/Settings/settings-telegram.js" defer></script>
    <script src="PROJECTS/Settings/settings-sandglass-tab.js" defer></script>
    <script src="PROJECTS/Settings/settings-modal.js" defer></script>
    <script src="PROJECTS/Settings/settings.js" data-hot-src="PROJECTS/Settings/settings.js" defer></script>
    <!-- 3D-рендер песочных часов вкладки Sandglass: ES-модуль (import three), поэтому type="module" -->
    <script src="PROJECTS/Settings/settings-sandglass.js" data-hot-src="PROJECTS/Settings/settings-sandglass.js" type="module"></script>
    <!-- book-tab.js раньше app.js был обязан: он строил #bookView сам, а app.js ищет
         его на старте для App.VIEWS. Теперь элемент приходит с разметкой страницы,
         но порядок оставлен — переставлять без нужды нечего -->
    <script src="PROJECTS/Book/book-tab.js" data-hot-src="PROJECTS/Book/book-tab.js" defer></script>
    <!-- telegram.js — по той же причине и с тем же оговорением, что book-tab.js -->
    <script src="PROJECTS/Telegram/telegram.js" data-hot-src="PROJECTS/Telegram/telegram.js" defer></script>
    <!-- ядро и вкладка Sessions — модули (DOCS/decisions/022): app.js импортирует
         SYSTEM/providers.js, sessions.js — свои ./sessions-*.js. Модульные скрипты
         без async выполняются в порядке документа наравне с defer, поэтому цепочка
         app.js → sessions.js → остальные файлы сохраняется -->
    <!-- общий механизм: пометку суждения рисуют все три отображения ленты -->
    <script src="SYSTEM/judgment-badge.js" data-hot-src="SYSTEM/judgment-badge.js" defer></script>
    <!-- тег модели над ответом — тем же порядком, до всех потребителей -->
    <script src="SYSTEM/model-tag.js" data-hot-src="SYSTEM/model-tag.js" defer></script>
    <script src="SYSTEM/app.js" data-hot-src="SYSTEM/app.js" type="module"></script>
    <script src="PROJECTS/Sessions/sessions.js" data-hot-src="PROJECTS/Sessions/sessions.js" type="module"></script>
    <script src="PROJECTS/Graph/file-editor.js" data-hot-src="PROJECTS/Graph/file-editor.js" defer></script>
    <script src="PROJECTS/Graph/vendor/easymde/easymde.min.js" data-hot-src="PROJECTS/Graph/vendor/easymde/easymde.min.js" defer></script>
    <script src="PROJECTS/Graph/md-editors.js" data-hot-src="PROJECTS/Graph/md-editors.js" defer></script>
    <!-- Вкладка Flow разбита по темам (DOCS/decisions/022): flow.js — только
         сборка модулей и отложенные вызовы, всё предметное лежит рядом по
         одному вопросу на файл. Порядок тегов обязателен — flow.js зовёт
         модули по именам и в этом порядке. -->
    <script src="PROJECTS/Flow/flow-nav.js" data-hot-src="PROJECTS/Flow/flow-nav.js" defer></script>
    <script src="PROJECTS/Flow/flow-canvas.js" data-hot-src="PROJECTS/Flow/flow-canvas.js" defer></script>
    <script src="PROJECTS/Flow/flow-node-state.js" data-hot-src="PROJECTS/Flow/flow-node-state.js" defer></script>
    <script src="PROJECTS/Flow/flow-node-tree.js" data-hot-src="PROJECTS/Flow/flow-node-tree.js" defer></script>
    <script src="PROJECTS/Flow/flow-panel-data.js" data-hot-src="PROJECTS/Flow/flow-panel-data.js" defer></script>
    <script src="PROJECTS/Flow/flow-panels.js" data-hot-src="PROJECTS/Flow/flow-panels.js" defer></script>
    <script src="PROJECTS/Flow/flow-selects.js" data-hot-src="PROJECTS/Flow/flow-selects.js" defer></script>
    <script src="PROJECTS/Flow/flow-edges.js" data-hot-src="PROJECTS/Flow/flow-edges.js" defer></script>
    <script src="PROJECTS/Flow/flow-layout.js" data-hot-src="PROJECTS/Flow/flow-layout.js" defer></script>
    <script src="PROJECTS/Flow/flow-session-node.js" data-hot-src="PROJECTS/Flow/flow-session-node.js" defer></script>
    <script src="PROJECTS/Flow/flow-session-build.js" data-hot-src="PROJECTS/Flow/flow-session-build.js" defer></script>
    <script src="PROJECTS/Flow/flow-edit.js" data-hot-src="PROJECTS/Flow/flow-edit.js" defer></script>
    <script src="PROJECTS/Flow/flow-panels-edit.js" data-hot-src="PROJECTS/Flow/flow-panels-edit.js" defer></script>
    <script src="PROJECTS/Flow/flow.js" data-hot-src="PROJECTS/Flow/flow.js" defer></script>
    <!-- 3D-персонаж в ноде QA: ES-модуль (import three), поэтому type="module" -->
    <script src="PROJECTS/Flow/flow-minion.js" data-hot-src="PROJECTS/Flow/flow-minion.js" type="module"></script>
    <script src="PROJECTS/Flow/flow-session-sync.js" data-hot-src="PROJECTS/Flow/flow-session-sync.js" defer></script>
    <script src="PROJECTS/Kanban/kanban.js" data-hot-src="PROJECTS/Kanban/kanban.js" defer></script>
    <!-- описание элемента идёт раньше режима: тот его вызывает при клике -->
    <script src="PROJECTS/Karandash/element-desc.js" data-hot-src="PROJECTS/Karandash/element-desc.js" defer></script>
    <!-- место элемента в коде: спрашивает индекс, поэтому тоже до режима -->
    <script src="PROJECTS/Karandash/element-code.js" data-hot-src="PROJECTS/Karandash/element-code.js" defer></script>
    <!-- вычисленные стили элемента: тоже до режима, он зовёт их при отправке -->
    <script src="PROJECTS/Karandash/element-style.js" data-hot-src="PROJECTS/Karandash/element-style.js" defer></script>
    <!-- сборка запроса: нужна и element-desc, и element-style, поэтому позже обоих -->
    <script src="PROJECTS/Karandash/comment-prompt.js" data-hot-src="PROJECTS/Karandash/comment-prompt.js" defer></script>
    <script src="PROJECTS/Karandash/karandash.js" data-hot-src="PROJECTS/Karandash/karandash.js" defer></script>
    <script src="SYSTEM/tabs.js" data-hot-src="SYSTEM/tabs.js" defer></script>
    <script src="SYSTEM/new-button.js" data-hot-src="SYSTEM/new-button.js" defer></script>
    <script src="SYSTEM/toolbar-reorder.js" data-hot-src="SYSTEM/toolbar-reorder.js" defer></script>
    <script src="SYSTEM/toolbar-menu.js" data-hot-src="SYSTEM/toolbar-menu.js" defer></script>
    <script src="SYSTEM/sidebar-resize.js" data-hot-src="SYSTEM/sidebar-resize.js" defer></script>
</body>
</html>
